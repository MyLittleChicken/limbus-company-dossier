# 개발용 PostgreSQL.
#
# 게임 데이터는 패치마다 전체 재생성하므로(ADR-01) 이 볼륨은 언제든 버려도 된다.
# 런 기록이 들어오는 시점부터는 사정이 달라지며, 그때 별도로 다룬다.
#
# 이 파일이 개발용 데이터베이스의 유일한 정의다. npm script(`db:up` · `db:ddl`)도
# 여기를 거친다 — 컨테이너 설정을 두 곳에 두면 로케일 같은 항목이 조용히 어긋난다.
#
#   npm run db:up             기동 (healthcheck 통과까지 대기)
#   npm run db:down           정지
#   docker compose down -v    정지하고 볼륨까지 제거

services:
  postgres:
    image: postgres:17-alpine
    container_name: limbus-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: limbus
      # 한국어 정렬·비교를 위해 로케일을 명시한다.
      LANG: ko_KR.utf8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - limbus-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d limbus"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  limbus-pgdata:
