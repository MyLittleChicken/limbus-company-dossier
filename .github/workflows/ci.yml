# 병합 전에 기계로 확인할 수 있는 것만 확인한다.
#
# 여기서 돌리지 않는 것이 있다 — `verify` 와 `engine:proof` 는 게임 원본 스냅샷(204 MB)과
# 채워진 PostgreSQL 을 요구한다. 원본은 상류 5곳에서 받아야 하고 저장소에 없으므로
# (docs/01-data-source.md 7절) PR 마다 돌리면 상류 장애가 곧 CI 적색이 된다.
# 같은 이유로 원본 파일을 읽는 단위 테스트 12건은 `data/entities` 가 없으면 스스로
# 건너뛴다(`hasSnapshot()` · src/v2/paths.ts). 로컬에서는 289건 전부 돈다.
# 데이터 계층 검증을 언제 어디서 돌릴지는 배포 방식과 함께 ADR 로 정한다.
#
# 배포(CD)는 이 파일이 다루지 않는다. 배포 환경 자체가 미결이다(docs/adr/05-web-serving.md 3.5).

name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 연달아 밀면 앞의 실행은 버린다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # `prisma validate` 와 `migrate diff` 는 스키마의 `env("DATABASE_URL")` 을 해석해야
  # 파일을 읽는다. 값이 없으면 P1012 로 실패한다. **접속하지는 않는다** — 파싱 대상일 뿐이다.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/limbus?schema=public
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: 타입·빌드·스키마
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20 은 2026-04-30 에 지원이 끝났다. 현행 LTS 로 돌린다.
          node-version: '22'
          cache: npm

      - run: npm ci

      # 타입 검사와 빌드가 @prisma/client 의 생성 타입에 의존한다. 먼저 만든다.
      # 스키마가 둘이므로 클라이언트도 둘이다 — 현행 public 과 신규 3스키마
      # (raw · canonical · app, docs/adr/06-three-schema-database.md).
      - name: Prisma Client 생성
        run: |
          npm run generate
          npm run v2:generate

      - name: 스키마 검증
        run: npm run v2:schema:validate

      # v1 스키마의 드리프트 검사는 없어졌다. `prisma/schema.prisma` 와
      # `prisma/schema.sql` 을 지웠기 때문이다 — 그것을 읽던 적재기·검증기도 함께
      # 갔다. 남은 스키마는 v2 하나뿐이다.
      - name: DDL 드리프트 — v2 (raw · canonical · app)
        run: |
          npx prisma migrate diff \
            --from-empty \
            --to-schema-datamodel prisma/v2/schema.prisma \
            --script > "$RUNNER_TEMP/v2-schema.sql"
          if ! diff -u prisma/v2/schema.sql "$RUNNER_TEMP/v2-schema.sql"; then
            echo "::error file=prisma/v2/schema.sql::schema.prisma 와 어긋난다. \`npm run v2:schema:ddl\` 로 재생성해 커밋한다."
            exit 1
          fi

      # 순수 함수 계층(저장·덱 코드)과 어휘 사전(설명문 파싱)의 단위 테스트.
      # 데이터베이스도 브라우저도 쓰지 않는다.
      - name: 단위 테스트
        run: npm test

      # 파이프라인(src/)과 웹(app/ · lib/ · components/)은 tsconfig 가 다르다.
      # 이 스크립트가 둘 다 돌린다.
      - name: 타입 검사
        run: npm run typecheck

      # 데이터베이스 없이 통과해야 한다 — 모든 라우트가 요청 시 렌더다
      # (docs/adr/05-web-serving.md 3.2). 여기서 실패하면 어딘가 사전 렌더로 굳었다는 뜻이다.
      - name: 빌드
        run: npm run build

  guard:
    name: 데이터 커밋 가드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # .githooks/pre-commit 과 같은 규칙을 저장소 전체에 적용한다.
      # 훅은 로컬 설정(core.hooksPath)에 의존해 클론마다 꺼져 있을 수 있고
      # `git commit --no-verify` 로도 우회된다. 여기가 마지막 방어선이다.
      - name: data/ 추적 파일 화이트리스트
        run: |
          allowed="data/README.md data/manifest.json data/coverage.json"
          status=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case " $allowed " in
              *" $f "*) ;;
              *)
                echo "::error file=$f::data/ 아래 추적 대상이 아닌 파일이다. 게임 원본은 커밋하지 않는다."
                status=1
                ;;
            esac
          done < <(git ls-files data/)
          exit $status

      # 애셋이나 덤프가 섞여 들어간 것을 잡는다. 훅과 같은 상한이다.
      - name: 파일 크기 상한 (5 MB)
        run: |
          max=$((5 * 1024 * 1024))
          status=0
          # `ls-tree -r` 은 blob 만 낸다. 크기 칸이 숫자가 아닌 경우는 나오지 않지만
          # 셸이 산술 비교에서 죽지 않도록 한 번 거른다.
          while read -r _mode _type _sha size path; do
            case "$size" in
              ''|*[!0-9]*) continue ;;
            esac
            if [ "$size" -gt "$max" ]; then
              echo "::error file=$path::$((size / 1024 / 1024)) MB — 상한 5 MB 를 넘는다."
              status=1
            fi
          done < <(git ls-tree -r -l HEAD)
          exit $status
